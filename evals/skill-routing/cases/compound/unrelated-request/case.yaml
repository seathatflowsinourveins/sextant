{
  "schema_version": "1.1",
  "name": "unrelated-request",
  "tags": [
    "negative-control"
  ],
  "execution": {
    "prompt": "Sort these words alphabetically and return only the words: zebra, apple, maple.",
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "append_system_prompt": "Read-only fixture evaluation: no orders, broker/data endpoints, credential access, file writes, shell commands or publication. Missing evidence stays unavailable. Give a concise response for the requested planning or review task.",
    "timeout_seconds": 3600
  },
  "graders": [
    {
      "name": "no-skill",
      "type": "tool_used",
      "tool": "Skill",
      "min": 0,
      "max": 0,
      "arm": "both"
    },
    {
      "name": "sorted",
      "type": "regex",
      "pattern": "apple[\\s,]+maple[\\s,]+zebra",
      "flags": "i"
    }
  ]
}
