{
  "schema_version": "1.1",
  "name": "tradingview-ticket",
  "tags": [
    "tradingview"
  ],
  "execution": {
    "prompt": "Review a manual order ticket from a TradingView chart before I type it: the note says buy because the candle is rising, with no risk limit, invalidation or revenge-risk check. Explain what the operator must resolve. This is display/manual-ticket review only.",
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "append_system_prompt": "Read-only fixture evaluation: no orders, broker/data endpoints, credential access, file writes, shell commands or publication. Missing evidence stays unavailable. Give a concise response for the requested planning or review task.",
    "timeout_seconds": 3600
  },
  "graders": [
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pre-trade-discipline-gate\""
    }
  ]
}
