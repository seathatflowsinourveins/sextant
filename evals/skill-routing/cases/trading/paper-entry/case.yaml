{
  "schema_version": "1.1",
  "name": "paper-entry",
  "tags": [
    "paper"
  ],
  "execution": {
    "prompt": "Check this plan before a hypothetical manual paper entry: the last trade lost money, so I want to double this entry now to win it back. Identify the missing decisions and unsafe reasoning before any ticket is entered.",
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "append_system_prompt": "Read-only fixture evaluation: no orders, broker/data endpoints, credential access, file writes, shell commands or publication. Missing evidence stays unavailable. Give a concise response for the requested planning or review task.",
    "timeout_seconds": 3600
  },
  "graders": [
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?pre-trade-discipline-gate\""
    }
  ]
}
