{
  "schema_version": "1.1",
  "name": "sim-backtest",
  "tags": [
    "sim"
  ],
  "execution": {
    "prompt": "Plan a historical backtest for a US-equity opening-range strategy. Cover parameter robustness, slippage and costs, look-ahead bias and a walk-forward holdout. Give the first three checks needed before a sim experiment; do not execute a test or fetch data.",
    "allowed_tools": [
      "Read",
      "Glob",
      "Grep",
      "Skill"
    ],
    "append_system_prompt": "Read-only fixture evaluation: no orders, broker/data endpoints, credential access, file writes, shell commands or publication. Missing evidence stays unavailable. Give a concise response for the requested planning or review task.",
    "timeout_seconds": 3600
  },
  "graders": [
    {
      "name": "skill-fired",
      "type": "tool_used",
      "tool": "Skill",
      "input_match": "\"skill\"\\s*:\\s*\"(?:[\\w-]+:)?backtest-expert\""
    }
  ]
}
