# tobi/qmd@v2.8.3 (facd35e01359e59d938bc9418e93fb9318addee3) project-local index, README "Configuring index.yml".
# In-project paths index with no trust prompt; the derived index.sqlite stays untracked. Use `qmd search` (BM25, no model).
collections:
  docs:
    path: ./docs
    pattern: "**/*.md"
  lanes:
    path: ./lanes
    pattern: "**/*.md"
# qmd's built-in defaults, exactly as `qmd update` writes them (cli/qmd.js ensureModelsConfiguredForCli),
# so it leaves this file unchanged. Defaults need no trust (trust.js); `search` still loads no model (#113).
models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
