# Sextant's one addition to Orca's own unit, as a systemd drop-in, so reinstalling Orca's service keeps it.
# Each terminal's memory cap, the old host's limits: northstar@b384d298d217d3f8d9aa83356994629536a34795:
# docs/handoff/workstation/phase-1-base.md, section 7. Orca reads them when its terminal host starts:
# stablyai/orca@a162e08b29b2883b02d8a0dfcc99e26c80b2cfe7:docs/site/content/docs/remote-servers.mdx.
[Service]
Environment=ORCA_TERMINAL_MEMORY_MAX=16G
Environment=ORCA_TERMINAL_MEMORY_SWAP_MAX=0
# dsh's non-secret settings, so a dsh tab Orca launches has them too (sextant.user-data sets them for logins).
# Billion-context off its default 18787, which the old lanes hold: ranxianglei/billion-context@v0.1.212
# daa082ead8a8ead60311e29ad4627bff0f569fc1:CONFIGURATION.md, ACP_PORT and BILI_ZONE_PORT.
Environment=DSH_TELEMETRY_DISABLED=1 DSH_PERMISSION_MODE=danger-full-access
Environment=ACP_HOST=127.0.0.1 ACP_PORT=21935 BILI_ZONE_PORT=21936 ACP_AUTO_UPDATE=0 ACP_AUTO_RESTART_ON_UPDATE=0
Environment=BILI_ADVISORY_CHECK=0 BILI_RELEASE_NOTES_CHECK=0
