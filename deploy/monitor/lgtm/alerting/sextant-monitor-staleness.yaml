# Source: Grafana alert-rule file provisioning (read 2026-11-10)
# https://grafana.com/docs/grafana/latest/alerting/set-up/provision-alerting-resources/file-provisioning/
# This is the single definition of monitor staleness. deploy/monitor/l7/rules.yaml
# no longer carries a MonitorEvidenceStale alert or its recording rule.
# Grafana creates the "Sextant" folder on load when it does not exist:
# grafana/grafana@v13.2.4 af4a33e3786594ad72f72d97e6744010330c2977,
# pkg/services/provisioning/alerting/rules_provisioner.go (getOrCreateFolderFullpath).
apiVersion: 1
groups:
  - orgId: 1
    name: sextant-monitor
    folder: Sextant
    interval: 60s
    rules:
      - uid: sextant-monitor-evidence-stale
        title: MonitorEvidenceStale
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              # absent/old -> 1; healthy -> fallback 0 (not No Data).
              expr: absent(sextant_monitor_last_success_timestamp_seconds) or (time() - sextant_monitor_last_success_timestamp_seconds > 900) or on() vector(0)
              instant: true
              range: false
              legendFormat: __auto
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params: []
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: B
              reducer: last
              type: reduce
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: threshold
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: Alerting
        execErrState: Alerting
        for: 5m
        annotations:
          summary: Monitor evidence is stale or unknown
          description: Render stale/unknown, never 0; the monitor does not hide its own gap.
          runbook: deploy/monitor/lgtm/alerting/README.md
        labels:
          severity: info
          delivery: informational
          action: proposal-only
          threshold_ref: monitor_staleness_seconds_max
          threshold_value: "900"
          source_series: sextant_monitor_last_success_timestamp_seconds
          producer_status: produced
        isPaused: false
