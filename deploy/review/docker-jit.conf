# Dedicated rootless Docker only. RootlessKit's documented compatibility mode keeps host
# networking inside its private namespace; no port driver publishes into WSL's namespace.
# The loopback TCP API serves the docker profile: gh-aw's arc-dind probe treats only a tcp://
# DOCKER_HOST as DinD (gh-aw 0627fdbe self-hosted-runners.md:43-44). /var/run/docker.sock is the
# daemon-side path actions/runner d1eb12d4 mounts into container jobs and actions
# (ContainerInfo.cs:57-60, ContainerActionHandler.cs:193). Sealed jobs reach neither.
# Ports published without a host address bind to loopback on every bridge (Docker port-publishing
# docs: dockerd --ip and default-network-opts host_binding_ipv4), so AWF's squid 3128:3128 is not
# reachable from the sealed bridge's gateway.
[Service]
Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_DETACH_NETNS=false
Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER=none
ExecStart=
ExecStart=/usr/bin/dockerd-rootless.sh --host=unix:///run/user/1501/docker.sock --host=unix:///var/run/docker.sock --host=tcp://127.0.0.1:2375 --tls=false --ip=127.0.0.1 --default-network-opt=bridge=com.docker.network.bridge.host_binding_ipv4=127.0.0.1
LimitCORE=0
