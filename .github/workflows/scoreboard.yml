# Publishes rows proven and median merge time to the pinned issue. pytest counts the proofs,
# github/issue-metrics measures the PRs, peter-evans/create-issue-from-file updates the issue.
name: scoreboard
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: read
concurrency:
  group: scoreboard
  cancel-in-progress: true
jobs:
  scoreboard:
    runs-on: [self-hosted, sextant]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove every manifest row
        id: prove
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          push: never
          skipContainerUserIdUpdate: true
          env: |
            GH_TOKEN
            UV_PROJECT_ENVIRONMENT=/tmp/venv
            PYTEST_ADDOPTS=-p no:cacheprovider
          runCmd: just sync && (just prove 2>&1 | tail -1)
      - name: Median merge time and open PRs
        uses: github/issue-metrics@671528652402b9b8a33da44b5c693b3161bc090f # v5.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: repo:${{ github.repository }} is:pr is:merged
      - name: Compose
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROVEN: ${{ steps.prove.outputs.runCmdOutput }}
        run: |
          {
            echo "## Proven rows"; echo '```'; printf '%s\n' "$PROVEN" | tail -1; echo '```'
            echo "## Open PRs: $(gh pr list --state open --json number --jq length)  (stop adding layers above 10)"
            echo "## Repo: $(git count-objects -vH | awk '/size-pack/{print $2,$3}'), $(git ls-files | wc -l) files"
            echo "Stop adding layers if median merge time passes 1 hour over the last 20 PRs, or proven rows stop rising across 20 merged PRs."
            cat issue_metrics.md
          } > scoreboard.md
      - uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          issue-number: ${{ vars.SCOREBOARD_ISSUE }}
          title: Scoreboard
          content-filepath: scoreboard.md
