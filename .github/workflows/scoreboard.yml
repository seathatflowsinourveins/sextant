# Publishes rows proven and median merge time to the pinned issue. The proofs run in the real
# sandbox image, so this builds it, and that is why it runs daily rather than on every merge.
# pytest counts, github/issue-metrics measures, peter-evans/create-issue-from-file updates the issue.
name: scoreboard
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions: {}
concurrency:
  group: scoreboard-daily
  cancel-in-progress: true
jobs:
  scoreboard:
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    # Scheduled runs fire on the default branch; a branch dispatch reaches sealed jobs.
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # devcontainers/ci installs its CLI with npm, which the runner image lacks.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Prove every manifest row, in the sandbox
        id: prove
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          push: never
          env: GH_TOKEN
          runCmd: just sync && bash -c 'set -o pipefail; just prove 2>&1 | tail -40'
      # A failed proof fails its own step and turns the job red. The issue still updates.
      - name: Median merge time
        if: ${{ !cancelled() }}
        uses: github/issue-metrics@671528652402b9b8a33da44b5c693b3161bc090f # v5.0.3
        env:
          GH_TOKEN: ${{ github.token }}
          SEARCH_QUERY: repo:${{ github.repository }} is:pr is:merged
      - name: Stop rule over the last 20 merges
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr list --state merged --limit 20 --json createdAt,mergedAt \
            --jq '.[] | ((.mergedAt | fromdateiso8601) - (.createdAt | fromdateiso8601)) / 3600' \
            > merge-hours.txt
          count=$(wc -l < merge-hours.txt)
          median=$(sort -n merge-hours.txt | awk '{a[NR]=$1} END {if (NR==0) {print "n/a"} else if (NR%2) printf "%.2f", a[(NR+1)/2]; else printf "%.2f", (a[NR/2]+a[NR/2+1])/2}')
          {
            echo "## Stop rule (last ${count} merged PRs)"
            echo "Median merge time: ${median} h against a 1.00 h limit."
            echo "The second stop is a flat proven-row count across the same 20-PR window."
          } > stop-rule.md
      - name: Compose
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PROVEN: ${{ steps.prove.outputs.runCmdOutput }}
        run: |
          {
            echo "## Proven rows"; echo '```'; printf '%s\n' "$PROVEN" | grep -E '^(FAILED|ERROR)|[0-9]+ (passed|failed)' | cut -c1-200; echo '```'
            echo "## Open PRs: $(gh pr list --state open --json number --jq length)  (stop adding layers above 10)"
            echo "## Repo: $(git count-objects -vH | awk '/size-pack/{print $2,$3}'), $(git ls-files | wc -l) files"
            cat stop-rule.md
            cat issue_metrics.md
          } > scoreboard.md
      - if: ${{ !cancelled() }}
        uses: peter-evans/create-issue-from-file@fca9117c27cdc29c6c4db3b86c48e4115a786710 # v6.0.0
        with:
          issue-number: ${{ vars.SCOREBOARD_ISSUE }}
          title: Scoreboard
          content-filepath: scoreboard.md
