# Enforces the first rule and cross-family review, from the base branch, so a PR cannot weaken them.
# The PR is data here: nothing from it runs. Routing, from the owner: dsh reviews every PR, and
# Anthropic's API joins only when quality needs it: a risk path, or a PR that dsh itself wrote.
name: review
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] see docs/adr/0001-sextant-foundation.md
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  PR: ${{ github.event.pull_request.number }}
  GH_REPO: ${{ github.repository }}
jobs:
  review:
    runs-on: ubuntu-24.04
    environment:
      name: review
      deployment: false
    timeout-minutes: 60
    steps:
      - name: Trusted rules, from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The PR's tree, as data
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .review/pr
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Does it touch a risk path?
        id: paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            risk:
              - 'src/sextant/execution/**'
              - 'src/sextant/risk/**'
              - 'lanes/live/**'
              - '.devcontainer/**'
              - '.github/**'
              - 'dangerfile.js'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Every change names its source
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npx --yes "danger@$(jq -r .dependencies.danger .devcontainer/agents/package.json)" ci --dangerfile dangerfile.js --failOnErrors
      - name: Prepare the diff and the prompt
        run: |
          git -C .review/pr diff "$BASE_SHA...$HEAD_SHA" > .review/pr.diff
          cat .github/review/head.md .github/review/rubric.md > .review/prompt.md
      - name: dsh reviews
        if: ${{ !contains(github.event.pull_request.body, 'Agent-Family dsh') }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSH_TELEMETRY_DISABLED: "1"
        run: npx --yes "@deepseek-ai/dsh@$(jq -r '.dependencies["@deepseek-ai/dsh"]' .devcontainer/agents/package.json)" --profile headless - < .review/prompt.md > .review/dsh.json
      - name: Load the review schema
        id: schema
        run: echo "json=$(jq -c . .github/review/schema.json)" >> "$GITHUB_OUTPUT"
      - name: Claude reviews, when quality needs it
        id: claude
        if: steps.paths.outputs.risk == 'true' || contains(github.event.pull_request.body, 'Agent-Family dsh')
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1.0.268
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          allowed_bots: dependabot[bot]
          prompt: Read .review/prompt.md and follow it exactly.
          claude_args: >-
            --model opus --effort max --allowedTools Read,Grep,Glob
            --json-schema '${{ steps.schema.outputs.json }}'
      - name: Keep Claude's answer
        if: steps.claude.outcome == 'success'
        env:
          ANSWER: ${{ steps.claude.outputs.structured_output }}
        run: printf '%s\n' "$ANSWER" > .review/claude.json
      - name: Report on the PR, and decide
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Review of \`$HEAD_SHA\`"
            for answer in .review/dsh.json .review/claude.json; do
              [ -f "$answer" ] || continue
              echo "#### $answer"; echo '```json'; cat "$answer"; echo; echo '```'
            done
          } > .review/comment.md
          gh pr comment "$PR" --body-file .review/comment.md
          # The verdict is the upstream rubric's. From round three only a P0 blocks, and the rest
          # becomes an issue, so a PR cannot loop for ever (owner-approved plan; ADR-0001).
          rounds=$(gh pr view "$PR" --json comments --jq '[.comments[] | select(.body | startswith("### Review of"))] | length')
          answers=$(find .review -maxdepth 1 -name '*.json')
          [ -n "$answers" ]
          for answer in $answers; do
            if [ "$rounds" -lt 3 ]; then
              jq -e '.overall_correctness == "patch is correct"' "$answer"
            else
              jq -e '[.findings[] | select(.priority == 0)] | length == 0' "$answer"
              if ! jq -e '.findings | length == 0' "$answer" > /dev/null; then
                gh issue create --title "Review follow-up from PR #$PR" --body-file .review/comment.md
              fi
            fi
          done
