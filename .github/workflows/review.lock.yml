name: "Review with dsh"
on:
  # bots: # Bots processed as bot check in pre-activation job
  # - dependabot[bot] # Bots processed as bot check in pre-activation job
  # - sextant-lanes-seathatflows[bot] # Bots processed as bot check in pre-activation job
  pull_request_target:
    # acknowledge-risk: true # Risk acknowledgment is compiler-only
    types:
      - opened
      - synchronize

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  group: "gh-aw-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref || github.run_id }}"
  cancel-in-progress: true

run-name: "Review with dsh"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.review
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Review%20with%20dsh,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=deepseek-harness'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

jobs:
  activation:
    name: activation
    needs: pre_activation
    if: >
      needs.pre_activation.outputs.activated == 'true' && ((!contains(github.event.pull_request.body, 'Review-Family') ||
      contains(github.event.pull_request.body, 'Review-Family codex') || contains(github.event.pull_request.body, 'Review-Family claude') ||
      contains(github.event.pull_request.body, 'Review-Family dsh')) && !contains(github.event.pull_request.body, 'Agent-Family dsh') &&
      (contains(github.event.pull_request.body, 'Agent-Family codex') || contains(github.event.pull_request.body, 'Agent-Family claude') ||
      (!contains(github.event.pull_request.body, 'Agent-Family') && !contains(github.event.pull_request.body, 'Review-Family dsh'))) &&
      !(contains(github.event.pull_request.body, 'Agent-Family codex') && contains(github.event.pull_request.body, 'Agent-Family claude')) &&
      !contains(github.event.pull_request.body, 'Review-Family claude') && !contains(github.event.pull_request.body, 'Review-Family codex'))
    runs-on:
      - self-hosted
      - linux
      - x64
      - sextant-jit-sealed
    environment: review
    # Permissions for the activation job (workflow permissions default to none).
    permissions:
