            const isAnthropic = provider === "anthropic";
            const apiKeyEnv = isAnthropic ? "ANTHROPIC_API_KEY" : "OPENAI_API_KEY";

            let baseURL;
            let apiKey;
            if (process.env.AWF_REFLECT_ENABLED === "1") {
