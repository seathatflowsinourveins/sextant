                      apiKeyEnv,
                      api: isAnthropic ? "anthropic-messages" : "openai-completions",
                      baseURL,
                      ...(effort && { reasoning: effort }),
                      models: [
                        {
                          id: model,
                          name: model,
                          ...(effort && { reasoningEfforts: { [effort]: effort }, compat: { forceAdaptiveThinking: true } }),
                        },
                      ],
                    },
                  },
                },
