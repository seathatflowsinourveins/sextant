# Runs from the base branch (pull_request_target), so a PR cannot change its own checks.
# The code under test runs only inside the dev container, built from the base branch's config,
# with no secrets. Nothing it writes stays: its tree is read as data and its output goes to /tmp.
name: ci
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] see docs/adr/0001-sextant-foundation.md
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: [self-hosted, sextant]
    timeout-minutes: 30
    steps:
      - name: Trusted config, from the base branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Code under test, merged onto its base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: .ci/tree
          ref: ${{ github.event.pull_request.number && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run the checks in the sandbox
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        with:
          push: never
          skipContainerUserIdUpdate: true
          env: |
            BASE_SHA
            HEAD_SHA
            UV_PROJECT_ENVIRONMENT=/tmp/venv
            RUFF_NO_CACHE=true
            PYTEST_ADDOPTS=-p no:cacheprovider
          runCmd: cd .ci/tree && just ci
