[project]
name = "sextant"
version = "0.1.0"
description = "Clean, trading-focused agent harness built only from SOTA upstreams"
requires-python = ">=3.13,<3.14"
dependencies = [
    "nautilus-trader[visualization]==2.0.0rc7",
    "typesafe-sdk==0.7.5",
    "requests==2.34.2",
]

[tool.uv.sources]
requests = { git = "https://github.com/psf/requests", rev = "6e83187b8feb273ed4c6cdab5efd8d54901dfab3" }

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.4", "zizmor==1.32.0"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [".devcontainer/post_install.py", "src/sextant/strategies/ema_cross.py", "src/sextant/research/b_exit_replay.py", ".claude/skills"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
testpaths = ["tests/repo", "tests/proofs/test_thin_slice.py", "tests/proofs/test_exit_engine.py", "tests/proofs/test_claude_shelf.py", "tests/proofs/test_workflows.py", "tests/proofs/test_candidate_history.py", "tests/proofs/test_exit_study_41.py", "tests/proofs/test_research_sources.py", "tests/proofs/test_options_jev.py", "tests/proofs/test_replay.py", "tests/proofs/test_reentry.py", "tests/proofs/test_sharadar_coverage.py"]
pythonpath = ["src"]
addopts = "-q"

[tool.pyright]
include = ["src", "tests"]
ignore = ["src/sextant/strategies/ema_cross.py", "src/sextant/research/b_exit_replay.py"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
